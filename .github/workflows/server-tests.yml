name: Server

on:
    pull_request:
        paths-ignore:
            - "ui/**"
            - "**.md"
    push:
        branches:
            - develop
            - main
        paths-ignore:
            - "ui/**"
            - "**.md"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Tests (frappe version-16)
        runs-on: ubuntu-latest
        timeout-minutes: 45

        services:
            redis-cache:
                image: redis:alpine
                ports:
                    - 13000:6379
            redis-queue:
                image: redis:alpine
                ports:
                    - 11000:6379
            mariadb:
                image: mariadb:11.8
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

        steps:
            - name: Clone
              uses: actions/checkout@v6

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Cache pip
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-version-16-${{ hashFiles('**/pyproject.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-version-16-

            - name: Install MariaDB client
              run: |
                  sudo apt-get update
                  sudo apt-get install -y mariadb-client

            - name: Setup bench
              run: |
                  pip install frappe-bench
                  bench init --skip-redis-config-generation --skip-assets \
                      --frappe-branch version-16 \
                      --python "$(which python)" ~/frappe-bench

            - name: Install whatsapp
              working-directory: /home/runner/frappe-bench
              run: |
                  bench get-app --skip-assets whatsapp "$GITHUB_WORKSPACE"
                  bench setup requirements --dev
                  bench new-site --db-root-password root --admin-password admin test_site
                  bench --site test_site install-app whatsapp
              env:
                  CI: "Yes"

            - name: Run tests
              working-directory: /home/runner/frappe-bench
              run: |
                  bench --site test_site set-config allow_tests true
                  bench --site test_site run-tests --app whatsapp
              env:
                  TYPE: server
                  CI: "Yes"
